apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurosplit-x-api
  labels:
    app: neurosplit-x
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neurosplit-x
  template:
    metadata:
      labels:
        app: neurosplit-x
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: api
          image: neurosplit-x/api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: NEUROSPLIT_MODE
              value: cognitive-control-plane
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: neurosplit-x-api
spec:
  selector:
    app: neurosplit-x
  ports:
    - port: 80
      targetPort: 8000
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neurosplit-x-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neurosplit-x-api
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
