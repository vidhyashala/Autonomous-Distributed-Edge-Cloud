services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEUROSPLIT_MODE: cognitive-control-plane
  redis:
    image: redis:7-alpine
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: neurosplit
      POSTGRES_USER: neurosplit
      POSTGRES_DB: neurosplit
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/neurosplitx
