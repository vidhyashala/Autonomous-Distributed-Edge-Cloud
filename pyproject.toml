[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosplit-x"
version = "0.1.0"
description = "Autonomous distributed edge-cloud cognitive intelligence framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.27",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
ai = [
  "torch>=2.2",
  "tensorflow>=2.15",
  "transformers>=4.38",
  "ray[rllib]>=2.9",
  "onnxruntime>=1.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
